<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your shelf — FavSongs</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://favsongs.pages.dev/" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="fonts.css" />
<link rel="stylesheet" href="styles.css" />
<!-- The shelf lives on the home page now. Old /shelf.html links (including
     shared #p= links) keep working: the hash and query are carried over. -->
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<main id="main" class="sec">
  <div class="s-error">
    <p class="kicker">one shelf, one page</p>
    <h1 class="display-sm">The shelf moved home.</h1>
    <p class="lede" style="margin:0 auto">Taking you to it — or open it yourself.</p>
    <p style="margin-top:1.6rem"><a class="btn btn-primary" id="go" href="index.html#shelf">Open my shelf</a></p>
  </div>
</main>
<script>
  (() => {
    const url = "index.html" + (location.search || "") + (location.hash || "#shelf");
    document.getElementById("go").href = url;
    location.replace(url);
  })();
</script>
</body>
